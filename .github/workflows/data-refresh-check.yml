name: Data refresh check

# Manual-only for now: runs the pipeline on GitHub's runners (which have
# normal internet access, unlike some sandboxed dev environments) and
# uploads the resulting dataset + review CSVs as an artifact, without
# committing anything. This is a diagnostic/validation trigger; the real
# scheduled monthly-refresh-and-PR workflow lands in a later phase.
on:
  workflow_dispatch:
    inputs:
      skip_wikidata:
        description: 'Skip Wikidata/Wikipedia/Commons enrichment (slowest step, ~51min; CAI now covers most of what it added for Italy)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # scripts/.cache/ (gitignored) holds every source's 30-day disk cache —
      # without this it's empty on every fresh runner, so even unchanged data
      # gets re-fetched from scratch on every run. restore-keys falls back to
      # the most recent cache available so it's still useful the first time
      # a new key is used, and each run saves a fresh one for the next.
      - name: Restore data pipeline cache
        uses: actions/cache@v4
        with:
          path: scripts/.cache
          key: data-pipeline-cache-${{ github.run_id }}
          restore-keys: |
            data-pipeline-cache-

      - name: Unzip boundary archives
        run: |
          for z in scripts/.cache/boundaries/*.zip; do
            [ -e "$z" ] || continue
            echo "Unzipping $z"
            unzip -o "$z" -d scripts/.cache/boundaries/
          done

      - run: npm run data:refresh
        env:
          SKIP_WIKIDATA_ENRICHMENT: ${{ inputs.skip_wikidata }}

      - name: Upload dataset + review CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-refresh-output
          path: |
            src/data/huts.json
            scripts/out/
          retention-days: 14
