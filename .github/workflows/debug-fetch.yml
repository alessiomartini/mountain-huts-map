name: debug-fetch (throwaway)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/new-session-i963at
      - uses: actions/download-artifact@v4
        with:
          name: data-refresh-output
          run-id: 34985672753
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit real dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/huts.json
          git status
          git diff --cached --stat
          git commit -m "Replace seed test data with real dataset from CAI/OSM/Wikidata/scrapers" -m "Generated by the data-refresh-check.yml run (id 34985672753): 5204 huts published (bivacco 2049, rifugio 3155) across Alpi italiane, Appennini, Bergen/Vestland, merged from CAI (748), OSM/Overpass, diska (1398), paesidivaltellina (219), hikesoftheworld (6), and Wikidata/Wikipedia/Commons. 619 huts now have a licensed photo. Verified 5204/5204."
          git push origin claude/new-session-i963at
