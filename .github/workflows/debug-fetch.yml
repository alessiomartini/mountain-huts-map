name: debug-fetch (throwaway)
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: data-refresh-output
          run-id: 34985672753
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect review CSVs
        run: |
          echo "===== FILE SIZES ====="
          wc -l scripts/out/*.csv src/data/huts.json
          echo
          echo "===== needs-review.csv: header + first 5 rows ====="
          head -6 scripts/out/needs-review.csv
          echo
          echo "===== needs-review.csv: reason-category breakdown ====="
          echo "administrative border: $(grep -c 'administrative border' scripts/out/needs-review.csv || true)"
          echo "tag says (OSM classification conflict): $(grep -c 'tag says' scripts/out/needs-review.csv || true)"
          echo "CAI type unrecognized: $(grep -c 'CAI type' scripts/out/needs-review.csv || true)"
          echo "schema validation failed: $(grep -c 'schema validation failed' scripts/out/needs-review.csv || true)"
          echo "(dropped-...) cluster rows: $(grep -c '(dropped-' scripts/out/needs-review.csv || true)"
          echo
          echo "===== needs-review.csv: 10 random sample rows ====="
          tail -n +2 scripts/out/needs-review.csv | shuf -n 10 --random-source=scripts/out/needs-review.csv
          echo
          echo "===== unverified.csv: header + first 5 rows ====="
          head -6 scripts/out/unverified.csv || echo "(file not present)"
          echo
          echo "===== candidates-from-mymaps.csv: header + first 5 rows ====="
          head -6 scripts/out/candidates-from-mymaps.csv || echo "(file not present)"
          echo
          echo "===== candidates-no-coords.csv: header + first 5 rows ====="
          head -6 scripts/out/candidates-no-coords.csv || echo "(file not present)"
          echo
          echo "===== huts.json: sample of 3 records ====="
          node -e "const d=require('./src/data/huts.json'); console.log(JSON.stringify(d.slice(0,3), null, 2));"
