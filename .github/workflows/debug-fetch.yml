name: Debug fetch

# Throwaway diagnostic workflow: runs a small tsx script on a runner with
# normal internet access (this sandboxed dev environment's egress is
# restricted to a small allowlist). Not part of the real pipeline — delete
# once no longer needed.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: CAI_DEBUG_LIMIT=5 npx tsx scripts/tmp-run-cai.ts
