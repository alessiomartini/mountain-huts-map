name: Debug fetch

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to fetch'
        required: true
        default: 'https://mountain-huts-map.alemarti-2001.workers.dev/it/hut/rifugio-torino/'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and grep for img tags
        run: |
          curl -sS -L -A "Mozilla/5.0 (compatible; mountain-huts-map-debug/1.0)" "${{ inputs.url }}" -o page.html
          echo "=== gallery-thumb img tags ==="
          grep -o '<img[^>]*>' page.html | head -5
          echo "=== length of file ==="
          wc -c page.html
