name: debug-fetch (throwaway)
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: refuges.info API doc - bbox and point sections
        run: |
          curl -sS "https://www.refuges.info/api/doc/" -o doc.html
          sed -E 's/<[^>]+>/ /g' doc.html | sed -E 's/[ \t]+/ /g' | sed '/^ *$/d' > doc.txt
          echo "--- bbox section ---"
          grep -n -i 'bbox' doc.txt | head -30
          echo "--- point example (id 583) ---"
          grep -n 'point?id=583' doc.txt
          echo "--- context around first bbox match ---"
          LINE=$(grep -n -i 'api/bbox' doc.txt | head -1 | cut -d: -f1)
          sed -n "${LINE},$((LINE+30))p" doc.txt

      - name: refuges.info point detail via documented example id=583
        run: |
          curl -sS "https://www.refuges.info/api/point?id=583&format=json" -o point583.json
          wc -c point583.json
          jq . point583.json 2>/dev/null || head -c 3000 point583.json

      - name: refuges.info bbox retry with several param name guesses
        run: |
          for PARAMS in "format=json&west=6.7&south=45.7&east=7.2&north=46.0" "format=json&lon_min=6.7&lat_min=45.7&lon_max=7.2&lat_max=46.0" "format=json&bbox=6.7,45.7,7.2,46.0" "format=json&nw_lng=6.7&nw_lat=46.0&se_lng=7.2&se_lat=45.7"; do
            echo "=== trying: $PARAMS ==="
            curl -sS "https://www.refuges.info/api/bbox?$PARAMS" -o bbox_try.json
            wc -c bbox_try.json
            head -c 500 bbox_try.json
            echo
          done

      - name: refuges.info massif example (id 351, from doc)
        run: |
          curl -sS "https://www.refuges.info/api/massif?massif=351&type_points=all&format=json" -o massif351.json
          wc -c massif351.json
          jq . massif351.json 2>/dev/null | head -100 || head -c 2000 massif351.json
