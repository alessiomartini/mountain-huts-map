name: Debug fetch

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: CAI_DEBUG_LIMIT=8 CAI_DEBUG_OFFSET=300 npx tsx scripts/tmp-run-cai.ts
