name: Debug fetch

# Throwaway diagnostic: fetches a URL from a runner with normal internet
# access (this sandboxed dev environment's egress is restricted to a small
# allowlist) and prints the response to the job log. Not part of the real
# pipeline — delete once no longer needed.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to fetch'
        required: true
        default: 'https://mountain-huts-map.alemarti-2001.workers.dev'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch URL
        run: |
          for path in "" "it/" "it/list/" "it/hut/rifugio-torino/" "it/about/"; do
            url="${{ inputs.url }}/$path"
            echo "=== $url ==="
            curl -sS -o /dev/null -w "HTTP %{http_code} - %{size_download} bytes - %{time_total}s\n" -L -A "Mozilla/5.0 (compatible; mountain-huts-map-debug/1.0)" "$url"
          done
