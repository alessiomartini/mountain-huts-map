name: debug-fetch (throwaway)
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: refuges.info exact documented example, with status codes
        run: |
          echo "=== point id=583 format=xml (exact doc example) ==="
          curl -sS -i "https://www.refuges.info/api/point?id=583&format=xml&format_texte=html" -o point_xml.txt
          head -30 point_xml.txt
          echo "size:"; wc -c point_xml.txt

          echo
          echo "=== massif=351 exact doc example (no format specified) ==="
          curl -sS -i "https://www.refuges.info/api/massif?massif=351&type_points=all&nb_points=22" -o massif_default.txt
          head -30 massif_default.txt
          wc -c massif_default.txt

          echo
          echo "=== bbox world, no format ==="
          curl -sS -i "https://www.refuges.info/api/bbox?bbox=world" -o bbox_world.txt
          head -30 bbox_world.txt
          wc -c bbox_world.txt

          echo
          echo "=== bbox literal doc example value, xml ==="
          curl -sS -i "https://www.refuges.info/api/bbox?bbox=-13.00,44.05,17.00,49.79&format=xml" -o bbox_fr.txt
          head -40 bbox_fr.txt
          wc -c bbox_fr.txt

          echo
          echo "=== retry with a browser-like User-Agent, point id=583 json ==="
          curl -sS -i -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" "https://www.refuges.info/api/point?id=583&format=json" -o point_ua.txt
          head -30 point_ua.txt
          wc -c point_ua.txt
